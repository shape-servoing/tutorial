/* ==========================================================================
   Shape servoing tutorial - interactive companion
   Visual language: entity colours of the paper
   figures (rod blue, tracked points yellow, target slate, grippers violet and
   orange, failures red).
   ========================================================================== */

:root {
    color-scheme: light;
    --bg: #f7f8f7;
    --surface: #ffffff;
    --surface-soft: #f0f3f1;
    --ink: #1d2522;
    --ink-soft: #46504b;
    --muted: #6d7773;
    --line: #dce1de;
    --line-strong: #c2cac6;
    --accent: #527563;
    --accent-strong: #3e624f;
    --accent-soft: #eaf1ed;
    --canvas: #fbfcfb;
    --grid: #e8ece9;
    --grid-strong: #d5dcd8;
    --robot: #9aa6a1;
    --robot-deep: #7b8983;
    --joint: #5d6a64;
    --shadow: 0 12px 36px rgba(28, 39, 34, 0.07);

    --rod: #2a78d6;
    --feature: #eda100;
    --feature-ring: #1d2522;
    --target: #868aad;
    --target-point: #727273;
    --grip-l: #4a3aa7;
    --grip-r: #eb6834;
    --red: #e34948;
    --aqua: #1baf7a;
    --green: #2e8540;
    --rep-points: #2a78d6;
    --rep-edges: #eb6834;
    --rep-angles: #1baf7a;
    --div-neg: #e34948;
    --div-pos: #2a78d6;
    --div-mid: #f0efec;

    --font: "Aptos", "Segoe UI Variable", "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif;
    --mono: "Cascadia Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-family: var(--font);
}

[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111513;
    --surface: #171c19;
    --surface-soft: #202723;
    --ink: #eef1ef;
    --ink-soft: #c3cbc7;
    --muted: #929d97;
    --line: #303833;
    --line-strong: #48524c;
    --accent: #91b19f;
    --accent-strong: #b2cdbf;
    --accent-soft: #26372f;
    --canvas: #1c221f;
    --grid: #2a322d;
    --grid-strong: #3a443d;
    --robot: #6f7d77;
    --robot-deep: #586661;
    --joint: #aab6b0;
    --shadow: 0 16px 40px rgba(0, 0, 0, 0.24);

    --rod: #4b93ea;
    --feature: #f2b52a;
    --feature-ring: #111513;
    --target: #a7abcc;
    --target-point: #a3a3a6;
    --grip-l: #8d80ee;
    --grip-r: #f08a5a;
    --red: #ec6b6a;
    --aqua: #2bbd88;
    --green: #4caf63;
    --rep-points: #4b93ea;
    --rep-edges: #f08a5a;
    --rep-angles: #2bbd88;
    --div-neg: #ec6b6a;
    --div-pos: #4b93ea;
    --div-mid: #2b302d;
}

/* Level 2 (advanced concepts): a warm sand palette for the page, canvases,
   robot arms, and interface accents, so that level 2 demos are recognizable at
   a glance. Entity colours (rod, points, target, grippers) do not change.
   Applied to <html> on level 2 demo pages and to the level 2 menu section. */
[data-part="2"] {
    --bg: #f7f4ee;
    --surface: #fffdf9;
    --surface-soft: #f3eee4;
    --muted: #776f66;
    --line: #e4ddd0;
    --line-strong: #cdc3b1;
    --accent: #8d6b43;
    --accent-strong: #6f5232;
    --accent-soft: #f2eadc;
    --canvas: #fdfbf7;
    --grid: #efe9de;
    --grid-strong: #e0d7c7;
    --robot: #a9a297;
    --robot-deep: #8a8377;
    --joint: #6b645a;
    --div-mid: #f2efe9;
}
[data-theme="dark"][data-part="2"], [data-theme="dark"] [data-part="2"] {
    --bg: #15130f;
    --surface: #1c1915;
    --surface-soft: #27221b;
    --muted: #a09586;
    --line: #38312a;
    --line-strong: #51493e;
    --accent: #c9a97f;
    --accent-strong: #dcc29e;
    --accent-soft: #392f23;
    --canvas: #221e18;
    --grid: #302a22;
    --grid-strong: #423a30;
    --robot: #80786c;
    --robot-deep: #685f54;
    --joint: #b8ad9e;
    --div-mid: #2e2a24;
}

/* Optional colour-blind palette (⋯ menu), after the Okabe-Ito set: red becomes
   vermillion, green bluish green, and aqua sky blue, so that pairs such as
   failure/success, command/response, and edge vectors/turning angles stay
   distinct under common colour-vision deficiencies. The colour names used in
   the lessons (blue rod, yellow points, violet and orange grippers, red, green)
   still apply. The dark rule sets every property of the light one. */
[data-palette="cvd"] {
    --rod: #0072b2;
    --red: #d55e00;
    --aqua: #56b4e9;
    --green: #009e73;
    --rep-points: #0072b2;
    --rep-angles: #009e73;
    --div-neg: #d55e00;
    --div-pos: #0072b2;
}
[data-theme="dark"][data-palette="cvd"] {
    --rod: #4ba3e3;
    --red: #f07f3c;
    --aqua: #8ed0f2;
    --green: #1db38a;
    --rep-points: #4ba3e3;
    --rep-angles: #1db38a;
    --div-neg: #f07f3c;
    --div-pos: #4ba3e3;
}

*, *::before, *::after { box-sizing: border-box; }

html, body { margin: 0; }

body {
    min-height: 100vh;
    color: var(--ink);
    background: var(--bg);
    font-size: 15px;
    line-height: 1.5;
    text-rendering: optimizeLegibility;
}

button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
h1, h2, h3, h4, p { margin-top: 0; }
a { color: var(--accent-strong); }
code, .mono { font-family: var(--mono); font-size: 0.86em; }

/* ---------------------------------------------------------------- topbar */
.topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    gap: 14px;
    align-items: center;
    padding: 10px 22px;
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(8px);
}
.brand { display: flex; gap: 10px; align-items: center; color: var(--ink); font-weight: 720; text-decoration: none; letter-spacing: -0.01em; }
.brand-mark { display: grid; width: 30px; height: 30px; place-items: center; border-radius: 9px; background: var(--accent-soft); }
.topbar-title { min-width: 0; overflow: hidden; color: var(--muted); font-size: 0.82rem; white-space: nowrap; text-overflow: ellipsis; }
.topbar-title strong { color: var(--ink); font-weight: 680; }
.topbar-spacer { flex: 1; }
.topbar-nav { display: flex; gap: 6px; }

/* ---------------------------------------------------------------- buttons */
.button {
    display: inline-flex;
    gap: 6px;
    align-items: center;
    justify-content: center;
    min-height: 33px;
    padding: 6px 12px;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    color: var(--ink);
    background: var(--surface);
    font-size: 0.76rem;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    white-space: nowrap;
}
.button:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.button:disabled { color: var(--muted); cursor: not-allowed; opacity: 0.55; }
.button.primary { color: #ffffff; border-color: var(--accent-strong); background: var(--accent-strong); }
.button.primary:hover:not(:disabled) { color: #ffffff; background: var(--accent); }
[data-theme="dark"] .button.primary, [data-theme="dark"] .button.primary:hover:not(:disabled) { color: #152019; }
.button.ghost { border-color: transparent; background: transparent; }
.button.small { min-height: 28px; padding: 4px 9px; font-size: 0.7rem; }
.button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.icon-button { width: 34px; padding: 0; }

/* ---------------------------------------------------------------- menu */
.menu { width: min(100%, 1180px); margin: 0 auto; padding: 34px 24px 60px; }
.menu-intro-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; align-items: start; margin-bottom: 34px; }
.menu-hero { min-width: 0; }
.kicker { margin: 0 0 6px; color: var(--accent); font-size: 0.72rem; font-weight: 760; letter-spacing: 0.1em; text-transform: uppercase; }
.menu-hero h1 { margin-bottom: 12px; font-size: clamp(1.9rem, 3.8vw, 2.7rem); font-weight: 680; letter-spacing: -0.045em; line-height: 1.04; }
.menu-hero p { color: var(--ink-soft); font-size: 0.98rem; }
/* How to use the demos, glossary, definitions, and citation, under the introduction. */
.hero-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 2px; }
.hero-actions .button { min-height: 36px; padding: 7px 14px; font-size: 0.8rem; }
.hero-action-icon { display: inline-grid; width: 18px; height: 18px; place-items: center; border-radius: 6px; color: var(--accent-strong); background: var(--accent-soft); font-size: 0.78rem; font-weight: 800; }
.paper-figure { min-width: 0; margin: 0; }
.paper-figure-panel { padding: 12px 14px; border: 1px solid var(--line); border-radius: 16px; background: #ffffff; box-shadow: var(--shadow); }
.paper-figure img { display: block; width: 100%; max-width: 900px; height: auto; margin: 0 auto; }
.paper-figure figcaption { margin: 9px 4px 0; color: var(--ink-soft); font-size: 0.76rem; line-height: 1.45; }
.paper-figure figcaption b { color: var(--ink); }
.loop-strip { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.loop-chip { padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink-soft); background: var(--surface); font-size: 0.72rem; font-weight: 650; }
.loop-chip b { color: var(--accent-strong); }

.part { margin-top: 30px; }
.part[data-part="2"] { margin-top: 40px; padding: 20px 20px 24px; border: 1px solid var(--line); border-radius: 18px; color: var(--ink); background: var(--bg); }
.part-tag { display: inline-block; margin-right: 8px; padding: 2px 9px; border-radius: 999px; color: var(--accent-strong); background: var(--accent-soft); font-size: 0.66rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; vertical-align: 2px; }
.topbar .part-tag { margin-right: 6px; }
.part-heading { display: flex; gap: 14px; align-items: baseline; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.part-heading h2 { margin: 0; font-size: 1.18rem; letter-spacing: -0.02em; }
.part-heading p { margin: 0; color: var(--muted); font-size: 0.82rem; }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }

.demo-card {
    position: relative;
    display: grid;
    grid-template-rows: auto 1fr;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 14px;
    color: inherit;
    background: var(--surface);
    box-shadow: var(--shadow);
    text-decoration: none;
    transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}
.demo-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.demo-card canvas { display: block; width: 100%; aspect-ratio: 2.3 / 1; background: var(--canvas); border-bottom: 1px solid var(--line); }
.demo-card-body { display: grid; gap: 6px; padding: 14px 16px 16px; }
.demo-card-top { display: flex; gap: 10px; align-items: baseline; }
.demo-index { color: var(--accent); font-family: var(--mono); font-size: 0.78rem; font-weight: 700; }
.demo-card h3 { margin: 0; font-size: 1.0rem; letter-spacing: -0.015em; }
.demo-card p { margin: 0; color: var(--muted); font-size: 0.8rem; }
.concepts { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
.concept { padding: 2px 8px; border-radius: 999px; color: var(--accent-strong); background: var(--accent-soft); font-size: 0.66rem; font-weight: 700; }
.visited-badge { position: absolute; top: 10px; right: 10px; padding: 2px 8px; border-radius: 999px; color: var(--accent-strong); background: var(--surface); font-size: 0.64rem; font-weight: 760; box-shadow: inset 0 0 0 1px var(--line); }
.menu-footer { margin-top: 40px; color: var(--muted); font-size: 0.78rem; }

/* ---------------------------------------------------------------- demo page */
.demo-layout { display: grid; grid-template-columns: 380px minmax(0, 1fr); min-height: calc(100vh - 55px); }
.lesson {
    position: sticky;
    top: 55px;
    height: calc(100vh - 55px);
    overflow-y: auto;
    padding: 24px 24px 40px;
    border-right: 1px solid var(--line);
    background: var(--surface);
}
.lesson h1 { margin-bottom: 8px; font-size: 1.55rem; font-weight: 690; letter-spacing: -0.035em; line-height: 1.1; }
.lesson-intro { color: var(--ink-soft); font-size: 0.9rem; }
.lesson-block { margin-top: 20px; }
.lesson-block p, .lesson-block li { color: var(--ink-soft); font-size: 0.86rem; }
.lesson-kicker { margin-bottom: 8px !important; color: var(--accent-strong) !important; font-size: 0.66rem !important; font-weight: 820; letter-spacing: 0.09em; text-transform: uppercase; }
.lesson .tex-block { margin: 10px 0 12px; padding: 10px 12px; overflow-x: auto; border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; background: var(--surface-soft); }
.lesson .tex-block .katex-display { margin: 0; }
.missions { margin: 0; padding-left: 0; list-style: none; counter-reset: mission; }
.missions li { position: relative; margin-bottom: 9px; padding-left: 30px; }
.missions li::before {
    counter-increment: mission;
    content: counter(mission);
    position: absolute;
    top: 1px;
    left: 0;
    display: grid;
    width: 20px;
    height: 20px;
    place-items: center;
    border-radius: 50%;
    color: var(--accent-strong);
    background: var(--accent-soft);
    font-size: 0.68rem;
    font-weight: 800;
}
.takeaway { padding: 14px 16px; border-radius: 12px; background: var(--accent-soft); }
.takeaway p { margin: 0; color: var(--ink) !important; }
.lesson details { margin-top: 18px; border-top: 1px solid var(--line); }
.lesson summary { padding: 10px 0; color: var(--ink); font-size: 0.84rem; font-weight: 720; cursor: pointer; }
.lesson-nav { display: flex; gap: 8px; justify-content: space-between; margin-top: 26px; }

.workspace { min-width: 0; padding: 20px 22px 40px; }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.stage.wide-rail { grid-template-columns: minmax(0, 1fr) 360px; }
.stage.no-rail { grid-template-columns: minmax(0, 1fr); }

.card { min-width: 0; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
.card + .card { margin-top: 12px; }
.card-heading { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
.card-heading h3 { margin: 0; font-size: 0.84rem; font-weight: 730; }
.card-note { color: var(--muted); font-size: 0.7rem; font-variant-numeric: tabular-nums; }
.rail { display: grid; gap: 12px; }
.rail .card + .card { margin-top: 0; }

.scene-canvas { display: block; width: 100%; height: clamp(230px, 32vh, 310px); border: 1px solid var(--line); border-radius: 10px; background: var(--canvas); touch-action: none; }
.scene-canvas.tall { height: clamp(250px, 36vh, 340px); }
.scene-canvas.compact { height: clamp(210px, 27vh, 255px); }
.scene-canvas.spatial-canvas { height: clamp(245px, 30vh, 300px); cursor: grab; }
.spatial-view-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
.spatial-mini-view { position: relative; min-width: 0; }
.spatial-mini-canvas { display: block; width: 100%; height: 82px; border: 1px solid var(--line); border-radius: 8px; background: var(--canvas); }
.spatial-mini-view > span { position: absolute; right: 7px; bottom: 5px; padding: 1px 4px; border-radius: 4px; color: var(--muted); background: color-mix(in srgb, var(--canvas) 82%, transparent); font-size: 0.61rem; font-weight: 650; letter-spacing: 0.02em; }
.subspace-canvas { display: block; width: 100%; height: 250px; border: 1px solid var(--line); border-radius: 9px; background: var(--canvas); }
.interaction-guide { margin: -1px 0 9px; padding: 7px 9px; border-left: 3px solid var(--accent); border-radius: 0 7px 7px 0; color: var(--ink-soft); background: var(--accent-soft); font-size: 0.71rem; line-height: 1.4; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; padding: 8px 2px 0; color: var(--muted); font-size: 0.7rem; }
.legend-item { display: inline-flex; gap: 6px; align-items: center; }
.swatch { width: 18px; height: 0; border-top: 3px solid currentColor; border-radius: 2px; }
.swatch.dashed { border-top-style: dashed; }
.swatch.dot { width: 9px; height: 9px; border: 0; border-radius: 50%; background: currentColor; }
.swatch.ring { width: 10px; height: 10px; border: 1.6px solid currentColor; border-radius: 50%; }
.toolbar { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; padding-top: 10px; }
.toolbar-divider { width: 1px; height: 22px; margin: 0 3px; background: var(--line); }
.hint { color: var(--muted); font-size: 0.72rem; }

.plots { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-top: 16px; }
.plot-canvas { display: block; width: 100%; height: 190px; }
.plot-canvas.short { height: 150px; }
.plot-canvas.tall { height: 240px; }
.series-legend { display: flex; gap: 10px; flex-wrap: wrap; padding-top: 6px; color: var(--muted); font-size: 0.68rem; }
.series-legend > span { display: inline-flex; gap: 5px; align-items: center; }
.series-legend > span > i { width: 14px; height: 0; border-top: 2.5px solid currentColor; }
.series-legend > span > i.dotted { border-top-style: dotted; }
.series-legend > span > i.dashed { border-top-style: dashed; }

/* ---------------------------------------------------------------- controls */
.control { display: grid; gap: 4px; margin-bottom: 10px; }
.control-head { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; font-size: 0.76rem; }
.control-head label { color: var(--ink-soft); font-weight: 650; }
.control-head output { color: var(--ink); font-family: var(--mono); font-size: 0.72rem; font-variant-numeric: tabular-nums; }
.control-help { margin: -1px 0 2px; color: var(--muted); font-size: 0.67rem; font-weight: 450; line-height: 1.35; }
input[type="range"] { width: 100%; accent-color: var(--accent-strong); }
.segmented { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-soft); }
.segmented button { min-height: 28px; padding: 3px 10px; border: 0; border-radius: 8px; color: var(--muted); background: transparent; font-size: 0.72rem; font-weight: 720; cursor: pointer; }
.segmented button[aria-pressed="true"] { color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.switch { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; color: var(--ink-soft); font-size: 0.76rem; font-weight: 650; cursor: pointer; }
.switch input { width: 30px; height: 17px; accent-color: var(--accent-strong); }

.readouts { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 10px 14px; }
.readout > span { display: block; color: var(--muted); font-size: 0.66rem; }
.readout > strong { display: block; margin-top: 2px; color: var(--ink); font-size: 1.02rem; font-weight: 760; font-variant-numeric: tabular-nums; }
.readout > strong.good { color: var(--green); }
.readout > strong.bad { color: var(--red); }

.status { display: flex; gap: 8px; align-items: center; margin-top: 10px; color: var(--muted); font-size: 0.74rem; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); }
